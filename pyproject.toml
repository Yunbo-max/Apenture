[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aperture-vlm"
version = "0.2.1"
description = "Reusable visual-state adaptation for frozen vision-language models"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "tifffile>=2024.1",
  "tqdm>=4.66",
]

[project.scripts]
aperture = "aperture.cli:main"

[project.optional-dependencies]
train = [
  "accelerate>=1.2",
  "einops>=0.8",
  "peft>=0.14,<0.15",
  "qwen-vl-utils>=0.0.8",
  "timm>=1.0",
  "torchvision>=0.15,<1",
  "transformers>=4.57,<5",
]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
