name: APERTURE CPU validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,test]'

      - name: Validate release structure
        run: python scripts/validate_release.py

      - name: Compile Python sources
        run: python -m compileall -q src scripts

      - name: Check shell entry points
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -maxdepth 1 -type f -name '*.sh' -print0)

      - name: Run all CPU test suites
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          test_dirs=(tests)
          for dir in tests_*; do
            [[ -d "$dir" ]] && test_dirs+=("$dir")
          done
          python -m pytest -q "${test_dirs[@]}"

      - name: Smoke-test unified CLI
        run: |
          aperture --help
          aperture plan --suite core
