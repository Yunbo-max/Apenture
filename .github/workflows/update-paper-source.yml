name: Update verified APERTURE paper source

on:
  push:
    branches: [main]
    paths: [.github/workflows/update-paper-source.yml]

permissions:
  contents: write

jobs:
  update-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install verified text-only manuscript
        run: |
          set -euo pipefail
          cat > /tmp/paper.tgz.b64 <<'EOF'
[... ELLIPSIZATION ...]
EOF
          base64 -d /tmp/paper.tgz.b64 > /tmp/paper.tgz
          test "$(sha256sum /tmp/paper.tgz | cut -d' ' -f1)" = "3942dd189ce9f4f0346227c573cfa9bd51ab284a434a6f5b5e3444f0b6b0f71d"
          mkdir -p paper/visual_lens
          tar -xzf /tmp/paper.tgz -C paper/visual_lens
          cd paper/visual_lens
          sha256sum -c SHA256SUMS.paper
          test "$(find sections -maxdepth 1 -name 'part_*.tex' | wc -l)" -eq 10
          grep -R -q 'APERTURE: Learning to Refocus Visual Evidence' sections
          grep -R -q '\\subsection\*{Reproducibility statement}' sections
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/visual_lens
          git commit -m "paper: publish verified ICLR 2027 manuscript source"
          git push
